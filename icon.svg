<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Shoe sole -->
  <rect x="60" y="358" width="392" height="52" rx="26" fill="white" opacity="0.97"/>

  <!-- Shoe upper body -->
  <path d="M88,358 L88,228 Q88,178 140,172 L256,168 Q300,168 332,198 L432,318 Q448,342 430,358 Z"
        fill="white" opacity="0.97"/>

  <!-- Heel tab (back of shoe) -->
  <rect x="80" y="290" width="22" height="68" rx="11" fill="white" opacity="0.5"/>

  <!-- Ankle collar cutout (dark opening at top) -->
  <ellipse cx="190" cy="185" rx="56" ry="36" fill="#4338ca" opacity="0.55"/>

  <!-- Lace eyelets -->
  <circle cx="188" cy="230" r="8" fill="#6366f1"/>
  <circle cx="212" cy="223" r="8" fill="#6366f1"/>
  <circle cx="236" cy="216" r="8" fill="#6366f1"/>
  <circle cx="260" cy="210" r="8" fill="#6366f1"/>

  <!-- Toe cap accent line -->
  <path d="M90,310 Q120,290 160,285" stroke="rgba(99,102,241,0.4)" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
